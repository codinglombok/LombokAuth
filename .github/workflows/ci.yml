# Self-contained for now (TD-P0-08): replace with a caller of lombok-ci.yml from codinglombok/.github,
# and pin every action to a SHA before the first release (see LombokSQL for the pinned pattern).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: typescript
      - run: npm run typecheck
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm pack --dry-run
        working-directory: typescript
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
      - run: cargo build --no-default-features
        working-directory: rust
      - name: no_std on a bare-metal target (GP-4)
        run: cargo build --no-default-features --target thumbv7em-none-eabi
        working-directory: rust
      - run: cargo publish --dry-run --allow-dirty
        working-directory: rust
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - name: build with the declared rust-version
        run: cargo build && cargo build --no-default-features
        working-directory: rust
  mutation:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build && npx tsc -p tsconfig.test.json
        working-directory: typescript
      - run: node scripts/mutation-test.mjs
